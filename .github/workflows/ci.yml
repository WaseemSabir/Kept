name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "site/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "site/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS · build, test, app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          echo "key=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The unsandboxed debug binary draws the panel, the copy-only hint and
      # the Settings panes in sample states, light and dark, for design
      # review. Download them from the run's artifacts.
      - name: Render snapshots
        timeout-minutes: 5
        run: .build/debug/Kept --render-snapshots "$RUNNER_TEMP/snapshots"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: panel-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn
          retention-days: 14

      - name: Build Kept.app
        run: make app

      # The compat job launches this exact build on older macOS releases.
      - name: Archive Kept.app
        run: ditto -c -k --keepParent dist/Kept.app "$RUNNER_TEMP/Kept-app.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: kept-app
          path: ${{ runner.temp }}/Kept-app.zip
          retention-days: 7

      # The shortcut recorders in Settings load KeyboardShortcuts' strings
      # through Bundle.module, which looks in Contents/Resources inside an app.
      - name: Check bundled resources
        run: |
          bundle="dist/Kept.app/Contents/Resources/KeyboardShortcuts_KeyboardShortcuts.bundle"
          if [[ ! -d "$bundle" ]]; then
            echo "::error::Kept.app has no KeyboardShortcuts resource bundle"
            ls -la dist/Kept.app/Contents/Resources
            exit 1
          fi
          strings="$(find "$bundle" -path '*/en.lproj/Localizable.strings' -print -quit)"
          if [[ -z "$strings" ]]; then
            echo "::error::The KeyboardShortcuts bundle has no en.lproj/Localizable.strings"
            find "$bundle" -maxdepth 4
            exit 1
          fi
          if ! plutil -p "$strings" | grep -q 'Record Shortcut'; then
            echo "::error::$strings doesn't hold the recorder's strings"
            plutil -p "$strings" || cat "$strings"
            exit 1
          fi
          echo "Recorder strings: ${strings#dist/}"

      - name: Launch smoke test
        run: |
          log="$RUNNER_TEMP/kept.log"
          # Hide the build folder for the test: Bundle.module falls back to it,
          # and a user's Mac has none, so resources must come from the app.
          mv .build "$RUNNER_TEMP/spm-build"
          trap 'pkill -f "Kept.app/Contents/MacOS/Kept" || true; mv "$RUNNER_TEMP/spm-build" .build' EXIT

          # OS_ACTIVITY_DT_MODE copies Kept's log to stderr. `-settingsPane
          # shortcuts` (an argument-domain default) makes Settings open on the
          # Shortcuts pane, whose recorders load KeyboardShortcuts' strings.
          OS_ACTIVITY_DT_MODE=YES dist/Kept.app/Contents/MacOS/Kept -settingsPane shortcuts >"$log" 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0; wait "$pid" || status=$?
            echo "::error::Kept exited during launch (status $status)"
            cat "$log"
            exit 1
          fi

          # Opening the running app again opens Settings (the reopen event),
          # the way back in when macOS hides the menu bar icon.
          open dist/Kept.app
          sleep 4
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0; wait "$pid" || status=$?
            echo "::error::Kept exited after opening Settings (status $status)"
            cat "$log"
            exit 1
          fi
          if ! grep -q "Showing Settings: shortcuts" "$log" &&
             ! log show --last 2m --style compact \
                 --predicate 'subsystem == "app.kept.Kept" AND category == "settings"' 2>/dev/null |
               grep -q "Showing Settings: shortcuts"; then
            echo "::error::Reopening Kept didn't open Settings on the Shortcuts pane"
            cat "$log"
            exit 1
          fi

          echo "Kept is running (pid $pid) with Settings open on Shortcuts"
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          cat "$log"

  # Kept is built with the newest SDK but supports macOS 14+. Launch the app
  # built above on an older release to catch missing symbols or
  # back-deployment gaps in the Swift runtime. (GitHub has retired its
  # macOS 14 image; add it back here if a self-hosted runner provides one.)
  compat:
    name: Launch on ${{ matrix.os }}
    needs: macos
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kept-app
          path: ${{ runner.temp }}

      - name: Launch smoke test
        run: |
          sw_vers
          cd "$RUNNER_TEMP"
          ditto -x -k Kept-app.zip .
          codesign --verify --strict Kept.app
          log="$RUNNER_TEMP/kept.log"
          OS_ACTIVITY_DT_MODE=YES Kept.app/Contents/MacOS/Kept >"$log" 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0; wait "$pid" || status=$?
            echo "::error::Kept exited during launch on $(sw_vers -productVersion) (status $status)"
            cat "$log"
            exit 1
          fi
          open Kept.app
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::Kept exited after opening Settings on $(sw_vers -productVersion)"
            cat "$log"
            exit 1
          fi
          echo "Kept runs on macOS $(sw_vers -productVersion)"
          kill "$pid"
          wait "$pid" 2>/dev/null || true

  linux:
    name: Linux · KeptCore
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install SQLite headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
