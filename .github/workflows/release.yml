name: Release

# Builds, signs and packages Kept, then publishes a GitHub release with the
# disk image (Kept-<version>.dmg). The version comes from Resources/Info.plist.
#
#   Actions › Release › Run workflow (on master)  → tags v<version> and releases it
#   git push origin v<version>                    → releases that tag
#
# A version that's already released stops the run before it builds: bump
# CFBundleShortVersionString first.
#
# Signing depends on which repository secrets exist (docs/RELEASING.md):
#   none                                              → ad-hoc signature
#   MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD → Developer ID signature
#   … and NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8 → notarized and stapled

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time, never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: macOS · build, sign, package
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      notarized: ${{ steps.package.outputs.notarized }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build number counts commits; also fetches tags
          persist-credentials: false

      - name: Resolve the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Resources/Info.plist is the only place the version lives; the app
          # reads it from its bundle (About in Settings).
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          tag="v$version"
          if [[ "$EVENT" == "push" ]]; then
            if [[ "$TAG" != "$tag" ]]; then
              echo "::error file=Resources/Info.plist::Tag $TAG doesn't match CFBundleShortVersionString ($version). Bump the version, commit, and tag that commit."
              exit 1
            fi
          else
            if [[ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::Run releases from $DEFAULT_BRANCH, not ${REF#refs/heads/}."
              exit 1
            fi
            if tagged="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" &&
               [[ "$tagged" != "$(git rev-parse HEAD)" ]]; then
              echo "::error file=Resources/Info.plist::Tag $tag already marks another commit (${tagged:0:7}). Bump CFBundleShortVersionString for a new release."
              exit 1
            fi
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null)" == "false" ]]; then
            echo "::error file=Resources/Info.plist::Kept $version is already released. Bump CFBundleShortVersionString, commit, and run this again."
            exit 1
          fi
          echo "Releasing Kept $version as $tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Import the signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_P12" ]]; then
            echo "No MACOS_CERTIFICATE_P12 secret: Kept gets an ad-hoc signature."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/kept-signing.keychain-db"
          certificate="$RUNNER_TEMP/kept-signing.p12"
          keychain_password="$(openssl rand -base64 24)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # Search the new keychain first, then the existing ones.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identities="$(security find-identity -v -p codesigning "$keychain")"
          hash="$(awk '/"Developer ID Application: /{print $2; exit}' <<< "$identities")"
          name="$(awk -F'"' '/"Developer ID Application: /{print $2; exit}' <<< "$identities")"
          if [[ -z "$hash" ]]; then
            echo "::error::MACOS_CERTIFICATE_P12 holds no valid Developer ID Application identity."
            exit 1
          fi
          echo "Signing as $name"
          echo "identity=$hash" >> "$GITHUB_OUTPUT"

      - name: Build, sign and package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [[ "$SIGN_IDENTITY" == "-" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" || -z "$NOTARY_KEY_P8" ]]; then
            if [[ -n "$NOTARY_KEY_ID$NOTARY_ISSUER_ID$NOTARY_KEY_P8" ]]; then
              echo "::warning::Not notarizing: that needs the certificate secrets and all of NOTARY_KEY_ID, NOTARY_ISSUER_ID and NOTARY_KEY_P8."
            fi
            export NOTARIZE=0
          fi
          ./scripts/package.sh

      - name: Verify the disk image
        env:
          DMG: ${{ steps.package.outputs.dmg }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD: ${{ steps.package.outputs.build }}
          SIGNATURE: ${{ steps.package.outputs.signature }}
          NOTARIZED: ${{ steps.package.outputs.notarized }}
        run: |
          echo "$SHA256  $DMG" | shasum -a 256 -c -

          # The app as users get it: from the disk image.
          mount="$RUNNER_TEMP/kept-dmg"
          mkdir -p "$mount"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -force > /dev/null 2>&1 || true' EXIT
          ls -l "$mount"
          [[ -L "$mount/Applications" ]] || { echo "::error::The disk image has no Applications link"; exit 1; }
          check="$RUNNER_TEMP/check"
          rm -rf "$check" && mkdir -p "$check"
          ditto "$mount/Kept.app" "$check/Kept.app"
          hdiutil detach "$mount"
          trap - EXIT

          app="$check/Kept.app"
          binary="$app/Contents/MacOS/Kept"
          archs="$(lipo -archs "$binary")"
          echo "lipo -archs: $archs"
          lipo "$binary" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"
          plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundle(ShortVersionString|Version)'
          if [[ "$NOTARIZED" == "true" ]]; then
            xcrun stapler validate "$app"
            xcrun stapler validate "$DMG"
            spctl --assess --type execute --verbose=2 "$app"
          fi

          # Launch each slice for a few seconds (x86_64 under Rosetta, if installed).
          smoke() {
            local arch="$1" log="$RUNNER_TEMP/kept-$1.log" pid status=0
            arch "-$arch" "$binary" > "$log" 2>&1 &
            pid=$!
            sleep 6
            if ! kill -0 "$pid" 2> /dev/null; then
              wait "$pid" || status=$?
              echo "::error::Kept ($arch) exited during launch (status $status)"
              cat "$log"
              return 1
            fi
            kill "$pid" 2> /dev/null || true
            wait "$pid" 2> /dev/null || true
            echo "Kept ($arch) launched and kept running"
          }
          smoke arm64
          if arch -x86_64 /usr/bin/true 2> /dev/null; then
            smoke x86_64
          else
            echo "::notice::Rosetta isn't installed; skipped launching the x86_64 slice"
          fi

          {
            echo "### Kept $VERSION ($BUILD)"
            echo
            echo "- Architectures: $archs"
            echo "- Signature: $SIGNATURE"
            echo "- Notarized: $NOTARIZED"
            echo "- SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: Kept-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.dmg }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/kept-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
            echo "Removed the signing keychain"
          fi
          rm -f "$RUNNER_TEMP/kept-signing.p12"

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Kept-${{ needs.package.outputs.version }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.package.outputs.version }}
          SHA256: ${{ needs.package.outputs.sha256 }}
          NOTARIZED: ${{ needs.package.outputs.notarized }}
        run: |
          tag="v$VERSION"
          dmg="dist/Kept-$VERSION.dmg"
          echo "$SHA256  $dmg" | sha256sum -c -

          notes="$RUNNER_TEMP/notes.md"
          {
            echo "For macOS 14 Sonoma or later, on Apple silicon and Intel Macs."
            echo
            echo "### Install"
            echo
            echo "1. Download **Kept-$VERSION.dmg** below and open it."
            cat <<'EOF'
          2. Drag Kept to Applications, then open it from there.
          3. Press ⇧⌘V to see what you've copied. Kept also lives in the menu bar.
          4. The first time you paste, Kept asks for permission to paste into other apps. Until you allow it, Kept copies the clip and you press ⌘V.
          EOF
            if [[ "$NOTARIZED" != "true" ]]; then
              cat <<'EOF'

          ### If macOS says “Kept” Not Opened

          This build isn't notarized by Apple, so macOS stops its first launch. To open it anyway:

          - **macOS 15 and later:** click **Done**, open System Settings › Privacy & Security, scroll down to Security and click **Open Anyway** next to “Kept” was blocked to protect your Mac. Confirm with your password or Touch ID.
          - **macOS 14:** Control-click Kept in Applications, choose **Open**, then click **Open**.
          - **Or in Terminal:** `xattr -dr com.apple.quarantine /Applications/Kept.app`

          You do this once per version. Updates also lose Kept's permission to paste: in System Settings › Privacy & Security › Accessibility, remove Kept with − and add it back with +.
          EOF
            fi
            echo
            echo "SHA-256 of \`Kept-$VERSION.dmg\`: \`$SHA256\`"
            echo
          } > "$notes"

          # A draft left by an earlier run of the old workflow: start over.
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2> /dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "::error::Kept $VERSION is already released; not changing it."
              exit 1
            fi
            echo "Removing the draft release $tag"
            gh release delete "$tag" --yes
          fi

          # Creates the tag at this commit when it doesn't exist yet (a run
          # from master). A tag made with this token doesn't start another run.
          gh release create "$tag" "$dmg" --target "$COMMIT" \
            --title "Kept $VERSION" --notes-file "$notes" --generate-notes --latest
          gh release view "$tag" --json url --jq .url
