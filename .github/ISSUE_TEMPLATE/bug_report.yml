name: Bug report
description: Report a crash, unexpected behavior, or visual glitch in Kept
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! For security or privacy vulnerabilities (such as password-manager bypasses or data leaks), please report them privately via the repository's **Security** tab → **Report a vulnerability** instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Copy ...
        2. Press ⇧⌘V
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: kept-version
    attributes:
      label: Kept version
      description: Found in Settings › About (e.g., 0.1.0 (128) or local commit hash).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version & chip
      description: Found in Apple menu › About This Mac.
      placeholder: "macOS 15.4, Apple M2"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, Console logs, source/target app names, or permission state (Accessibility / Paste from Other Apps).
    validations:
      required: false
