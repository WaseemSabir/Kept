version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The product site (site/). One pull request a week for all of it.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      site:
        patterns: ["*"]
    # @astrojs/check accepts TypeScript 5 and 6 only; take 7 when it does.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
